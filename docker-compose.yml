services:
  nfl_score_predictor:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: nfl_score_predictor_container
    platform: linux/amd64
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    # Only these named config vars are forwarded from .env - never the whole
    # file - so unrelated secrets in .env are never passed into the container.
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_INJURY_ADJUSTMENTS=${ENABLE_INJURY_ADJUSTMENTS:-false}
      - VERBOSE_ADJUSTMENTS=${VERBOSE_ADJUSTMENTS:-false}
      - YEAR_ABBR=${YEAR_ABBR:-26}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET:-nfl-score-predictor-test-output}
    volumes:
      - ./nfl_predictor/data:/app/nfl_predictor/data

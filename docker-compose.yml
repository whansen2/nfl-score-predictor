services:
  nfl_score_predictor:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: nfl_score_predictor_container
    environment:
      - WEEK_NUMBER=18
      - YEAR_ABBR=24
      - GAME_DATE=2025-02-09
      - HOME_TEAM=Philadelphia Eagles
      - AWAY_TEAM=Kansas City Chiefs
      - LOG_LEVEL=Info
      - VERBOSE_ADJUSTMENTS=False
      - ENABLE_INJURY_ADJUSTMENTS=False
      - ENABLE_WEATHER_ADJUSTMENTS=False
      - ENABLE_UPSETS_AGENT=True
    volumes:
      - ./nfl_predictor/data:/app/nfl_predictor/data
    command: python nfl_predictor/nfl_ai_scores.py

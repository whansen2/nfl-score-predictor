[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-score-predictor"
version = "0.1.0"
description = "Linear Regression-based NFL game score predictor with injury adjustments and upset detection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "bandit[toml]>=1.8",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["nfl_predictor", "llm"]
branch = true
omit = []

[tool.coverage.report]
fail_under = 80
show_missing = true

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-score-predictor"
version = "0.1.0"
description = "Linear Regression-based NFL game score predictor with injury adjustments and upset detection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.1",
    "pyyaml==6.0.1",
    "scipy==1.12.0",
    "scikit-learn==1.4.1.post1",
    "python-dotenv==1.0.0",
    "boto3==1.34.84",
]

[tool.setuptools]
packages = ["nfl_predictor", "nfl_predictor.agents", "nfl_predictor.utils"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "bandit[toml]>=1.8",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["nfl_predictor"]
branch = true
omit = []

[tool.coverage.report]
fail_under = 40
show_missing = true

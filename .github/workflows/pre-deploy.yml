name: Pre-Deploy Checks

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize]
    branches: [ main ]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff>=0.4

      - name: Run ruff lint
        run: ruff check --select E,F,I,UP,B,SIM nfl_predictor

      - name: Run ruff format check
        run: ruff format --check nfl_predictor

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit[toml]>=1.8

      - name: Run bandit security scan
        run: bandit -c pyproject.toml -r nfl_predictor -ll

  test-python:
    name: Python Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv nfl_env
          source nfl_env/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          source nfl_env/bin/activate
          export WEEK_NUMBER=18
          export YEAR_ABBR=24
          pytest tests --cov=nfl_predictor --cov-report=term-missing --cov-fail-under=80

  docker-test:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: [lint, security, test-python]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose build

      - name: Run container to test
        run: docker compose up --abort-on-container-exit --exit-code-from nfl_score_predictor

name: Pre-Deploy Checks

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize]
    branches: [ main ]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@b4ffde65f46336ab88eb53be0f37965419b19ee5 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b1c82a5438215b42b9 # v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff>=0.4

      - name: Run ruff lint
        run: ruff check --select E,F,I,UP,B,SIM nfl_predictor llm

      - name: Run ruff format check
        run: ruff format --check nfl_predictor llm

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@b4ffde65f46336ab88eb53be0f37965419b19ee5 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b1c82a5438215b42b9 # v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit[toml]>=1.8

      - name: Run bandit security scan
        run: bandit -c pyproject.toml -r nfl_predictor llm -ll

  test-python:
    name: Python Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@b4ffde65f46336ab88eb53be0f37965419b19ee5 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b1c82a5438215b42b9 # v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv nfl_env
          source nfl_env/bin/activate
          pip install --upgrade pip
          pip install -r nfl_predictor/requirements.txt
          pip install pytest-cov>=5.0

      - name: Run tests with coverage
        run: |
          source nfl_env/bin/activate
          export WEEK_NUMBER=18
          export YEAR_ABBR=24
          pytest tests --cov=nfl_predictor --cov=llm --cov-report=term-missing --cov-fail-under=80

  docker-test:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: [lint, security, test-python]

    steps:
      - name: Checkout code
        uses: actions/checkout@b4ffde65f46336ab88eb53be0f37965419b19ee5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4476873422da7758216827e4ba3a42cffb3c6cc0 # v3

      - name: Build Docker image
        run: docker compose build

      - name: Run container to test
        run: docker compose up --abort-on-container-exit --exit-code-from nfl_score_predictor

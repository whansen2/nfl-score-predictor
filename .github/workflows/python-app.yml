name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m venv nfl_env
        source nfl_env/bin/activate
        pip install --upgrade pip
        pip install -r nfl_predictor/requirements.txt

    - name: Run tests
      run: |
        source nfl_env/bin/activate
        export WEEK_NUMBER=18
        export NUM_GAMES=1
        export GAME_DATE=2025-02-09
        export HOME_TEAM="Philadelphia Eagles"
        export AWAY_TEAM="Kansas City Chiefs"
        make test

  docker-test:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: test-python

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker-compose build

    - name: Run container to test
      run: docker-compose up --abort-on-container-exit --exit-code-from nfl_score_predictor

    - name: Upload predicted matchups
      if: success()
      uses: actions/upload-artifact@3a3c1b6b0b6ed4c874d22c6c28d0d24e8c55bd5c  # v3.1.3 SHA
      with:
        name: matchup-results
        path: nfl_predictor/data/predicted_matchups_test.csv

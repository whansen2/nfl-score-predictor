# for grading QBs
qb_tiers:
  elite: -6          # MVP-caliber QBs who significantly impact spreads
  above_average: -5  # Pro Bowl-level QBs who provide solid consistency
  average: -4        # Mid-tier starters, competent but not game-changers
  below_average: -3  # Replacement-level starters who limit offenses
  replacement_level: -2  # Backups or struggling QBs, minimal impact

